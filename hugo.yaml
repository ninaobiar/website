  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/me.png"
    roundImage: true
    content: |-
      I am a data ecologist and science communicator with a passion for data analysis and visualization. 
      I have a background in ecology and statistics, and I have a strong interest in the intersection of data science and environmental research. 
      I have worked with Parks Canada, the Mushkegowuk Council, and McGill University to research and communicate the impacts of climate change on biodiversity and ecosystem services.

      In all aspects of my work I aim to uphold my identity as a Filipino immigrant as I continue to mold my research here in Tiohtià:ke/Montreal. I am grateful to have been brought up navigating the delicate balance between superstition and science, inherited from generations of farmers in my family who imparted wisdom on sensing the health of our livestock and predicting harvest yields. 


    skills:
      enable: true
      title: "Here are a few of the skills I've been working on recently:"
      items:
        - "R"
        - "PowerBI"
        - "MySQL"
        - "HTML"
        - "CSS"
        - "JavaScript"
        
# projects
  projects:
    enable: true
    title: "Projects"
    items:
      - title: "Canada's Biodiversity and Ecosystem Services"
        content: " 'Useful' plants (i.e., food, medicine, materials) can be minimizied in biodiversity valuation. I investigate whether we can bridge biodiversity and ecosystem services. More specifically, I delve deeper into whether classic biodiversity metrics can be an effective surrogate for useful plant diversity"
        image: /images/projects/ConferencePoster.png
        badges:
          - "R"
          - "Species Distribution Modelling"
          - "Protected Areas"
          - "GBIF"
        links:
          - icon: fab fa-book-bookmark
            url: https://nph-onlinelibrary-wiley-com.proxy3.library.mcgill.ca/doi/full/10.1002/ppp3.10642

      - title: "Species Distribution Modelling for the Hudson Bay Lowlands"
        content: "Developed species distribution models for the Hudson Bay - James Bay Lowland (HJBL) area with Parks Canada and the Canadian Museum of Nature to evaluate biodiversity patterns and support federal conservation and land-use policy."
        image: /images/projects/20250821_111204.jpg
        badges:
          - "R"
          - "Species Distribution Modelling"
          - "Policy"
        links:
          - icon: fab fa-bookmark
            url: https://www.youtube.com/watch?v=Ut_y5nNucL8&list=PLOe6XX2wBaiZiQ7Aed32gBCR1pqDj451f&index=2
       
      - title: "Climate Change Effects on Albertan Avian Populations"
        content: "Analyzed effects of the climate crisis on Alberta's avian population using Maxent, ANOVA, and linear regression, and projected future populations of Mallard, Black-billed Magpie, and American Robin using GLMs."
        image: /images/projects/NorthernFlickerCareAIWC2022.jpg
        badges:
          - "R"
          - "GLM"
          - "Maxent"
        links:
          - icon: fab fa-bookmark
            url: https://www.aiwc.ca/blog/making-a-positive-impact-human-wildlife-co-existence/
      - title: "Conserving At-Risk Wildflowers from Invasive Species"
        content: "Undergraduate thesis investigating competition between at-risk and invasive plant species using species distribution modelling, focused on the COSEWIC-listed Dwarf Hesperochiron in British Columbia."
        image: /images/projects/knapweed.jpg
        badges:
          - "R"
          - "Conservation"

