# Outreach
  achievements:
    enable: true
    title: "Outreach"
    items:
      - title: "Student Representative, Inclusion and Diversity Committee"
        content: "My passion for celebrating diversity and fostering inclusivity is a driving force in how I approach science. As a student representative of the Inclusion and Diversity Commity within the Canadian Botanical Association , I am constantly working to advocate for opportunities and events that nurture an inclusive botanical community. 
          Being a female immigrant scientist can have its challenges… but being able to see positive change our institutions - albeit at a slower pace than one would hope - gives me hope! As always, happy to talk more about decolonizing, dismantling, and disrupting traditional norms in Western Science."
      - title: "Science Ambassador"
        content: As a Science Ambassador at the University of Calgary , I had the privilege of fostering a sense of wonder and curiosity within our scientific community. Through dynamic social media engagement and lively Faculty of Science events, I helped cultivate an environment where students and faculty alike are inspired to explore the wonders of science and pursue their passions with enthusiasm.
      - title: "Seminar Representative"
        content: "I organized weekly seminars hosting scientists in ecology and evolution, and research talks for graduate students at McGill University."

